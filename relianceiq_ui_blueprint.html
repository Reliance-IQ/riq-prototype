<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RelianceIQ — UI Blueprint v3 (clickable, no backend)</title>
<style>
:root{
  --g:#40826d; --g-dark:#2e6354; --g-deep:#1d4a3e; --g-soft:#e6f0ed; --g-softer:#f2f7f5;
  --bg:#f5f7f6; --surface:#ffffff; --border:#e3e8e6; --border-2:#d3dcd8;
  --ink:#1c332c; --ink-2:#496158; --ink-3:#7c8f89;
  --amber:#b97d10; --amber-bg:#fdf4e3; --red:#b3423a; --red-bg:#fbeceb;
  --blue:#2f6ea5; --blue-bg:#e9f1f8;
  --r:10px; --sh:0 1px 2px rgba(28,51,44,.05),0 4px 14px rgba(28,51,44,.06);
  --sh-lg:0 8px 40px rgba(28,51,44,.16);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--ink-3)}
h1,h2,h3{font-weight:650}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-weight:560;font-size:13.5px;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-p{background:var(--g);color:#fff}.btn-p:hover{background:var(--g-dark)}
.btn-p:disabled{background:#a9c4bb;cursor:not-allowed}
.btn-o{background:var(--surface);border-color:var(--border-2);color:var(--ink)}.btn-o:hover{border-color:var(--g);color:var(--g-dark)}
.btn-ghost{color:var(--ink-2);padding:7px 10px;border-radius:8px}.btn-ghost:hover{background:var(--g-softer);color:var(--g-dark)}
.btn-danger{color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.inp,.sel,.txa{width:100%;padding:9px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);outline:none;transition:.15s}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(64,130,109,.15)}
.inp:disabled,.sel:disabled{background:#f3f5f4;color:var(--ink-3)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.chip-ok{background:var(--g-soft);color:var(--g-deep)}
.chip-warn{background:var(--amber-bg);color:var(--amber)}
.chip-bad{background:var(--red-bg);color:var(--red)}
.chip-info{background:var(--blue-bg);color:var(--blue)}
.chip-mut{background:#eef1f0;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.muted{color:var(--ink-3);font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafcfb;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--g-softer)}
.progress{height:6px;background:#e8edeb;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .5s}
.login{display:flex;min-height:100vh}
.login-brand{flex:1;background:linear-gradient(160deg,var(--g-deep),var(--g-dark) 55%,var(--g));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login-brand h1{font-size:15px;letter-spacing:.34em;font-weight:700}
.login-brand .big{font-size:32px;line-height:1.25;font-weight:650;max-width:440px}
.login-brand p{opacity:.75;max-width:420px;margin-top:14px;line-height:1.6}
.login-form{width:500px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding:44px;overflow:auto;max-height:100vh}
.persona{display:flex;align-items:center;gap:11px;width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:10px;margin-top:7px;text-align:left;transition:.15s;background:var(--surface)}
.persona:hover{border-color:var(--g);background:var(--g-softer)}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--g-soft);color:var(--g-deep);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.ctx-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px}
.shell{display:flex;min-height:100vh}
.side{width:226px;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{font-size:13px;font-weight:700;letter-spacing:.28em;color:var(--g-deep);padding:6px 10px 14px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:var(--ink-2);font-weight:550;font-size:13.5px;width:100%;text-align:left}
.nav-i:hover{background:var(--g-softer)}
.nav-i.on{background:var(--g-soft);color:var(--g-deep)}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:14px 11px 5px;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:20}
.ctx-badge{display:flex;align-items:center;gap:8px;background:var(--g-softer);border:1px solid var(--border);padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--g-deep);white-space:nowrap}
.credits-chip{display:flex;align-items:center;gap:7px;font-weight:650;font-size:13px;background:var(--g-soft);color:var(--g-deep);padding:6px 12px;border-radius:99px;white-space:nowrap}
.bell{position:relative;padding:8px;border-radius:8px;font-size:16px}
.bell:hover{background:var(--g-softer)}
.bell .badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif-panel{position:fixed;top:60px;right:18px;width:400px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--sh-lg);z-index:80}
.notif-i{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.notif-i:hover{background:var(--g-softer)}
.notif-i.unread{background:#f4faf8}
.notif-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.impersonate{background:var(--amber-bg);color:var(--amber);border-bottom:1px solid #ecd9ab;padding:8px 22px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.content{padding:26px;max-width:1240px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-h h2{font-size:20px}
.page-h .sub{color:var(--ink-3);margin-top:3px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi .v{font-size:23px;font-weight:680;margin-top:5px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:600}
.kpi .d{font-size:11.5px;margin-top:4px;color:var(--ink-3)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.rowline{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0}
.views{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.view-t{padding:9px 14px;font-weight:580;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.view-t.on{color:var(--g-deep);border-color:var(--g)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .inp{width:250px}
.selbar{background:var(--g-deep);color:#fff;border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:var(--sh-lg)}
.check{width:15px;height:15px;accent-color:var(--g)}
.overlay{position:fixed;inset:0;background:rgba(20,35,30,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh-lg);width:580px;max-width:94vw;max-height:90vh;overflow:auto;padding:26px}
.modal.wide{width:940px}
.wiz-steps{display:flex;gap:0;margin:16px 0 20px}
.wiz-step{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);position:relative;padding-bottom:10px;border-bottom:3px solid #e8edeb}
.wiz-step.on{color:var(--g-deep);border-color:var(--g)}
.wiz-step.done{color:var(--g-dark);border-color:var(--g-soft)}
.wiz-num{width:22px;height:22px;border-radius:99px;background:#e8edeb;color:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:none}
.wiz-step.on .wiz-num{background:var(--g);color:#fff}
.wiz-step.done .wiz-num{background:var(--g-soft);color:var(--g-deep)}
.map-row td{padding:8px 12px}
.samp{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.err-tbl td{font-size:12.5px;padding:7px 10px}
.err-cell{color:var(--red);font-weight:600}
/* spreadsheet mock */
.sheet{border:1px solid #c9d3cf;border-radius:6px;overflow:auto;background:#fff;max-height:420px}
.sheet table{border-collapse:collapse;font-size:12.5px;font-family:"SF Mono",Menlo,Consolas,monospace}
.sheet th,.sheet td{border:1px solid #dfe6e3;padding:5px 8px;white-space:nowrap;text-align:left;background:#fff;font-weight:400}
.sheet thead th{background:#eef2f0;color:var(--ink-2);font-weight:600;font-size:11px;text-transform:none;letter-spacing:0;position:sticky;top:0;z-index:2}
.sheet .colhdr th{background:#e4eae7;color:var(--ink-3);font-size:10.5px;text-align:center;font-weight:600}
.sheet .rn{background:#eef2f0;color:var(--ink-3);text-align:center;font-size:10.5px;width:34px;position:sticky;left:0}
.sheet td[contenteditable]:focus{outline:2px solid var(--g);background:#f4faf8}
.cell-bad{background:#fdeceb !important;box-shadow:inset 0 0 0 1px #e8b4b0}
.cell-err{background:#fff6f5 !important;color:var(--red);font-weight:600;max-width:340px;white-space:normal}
.sheet-tab{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #c9d3cf;border-bottom:none;border-radius:6px 6px 0 0;padding:5px 14px;font-size:12px;font-weight:600;color:var(--ink-2)}
.modal h3{font-size:17px;margin-bottom:2px}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:94vw;background:var(--surface);box-shadow:var(--sh-lg);z-index:60;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer .d-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer .d-body{flex:1;overflow:auto;padding:18px 22px}
.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--g-deep);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--sh-lg);font-size:13px;font-weight:550;max-width:340px;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.vendor-row{border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:11px}
.region-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-2);border-radius:99px;padding:4px 11px;font-size:12.5px;margin:3px 4px 0 0;font-weight:550}
.region-chip.on{background:var(--g-soft);border-color:var(--g);color:var(--g-deep)}
.upload-zone{border:2px dashed var(--border-2);border-radius:12px;padding:30px;text-align:center;color:var(--ink-3);transition:.15s;cursor:pointer}
.upload-zone:hover{border-color:var(--g);background:var(--g-softer)}
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps i{flex:1;height:4px;border-radius:99px;background:#e8edeb}.steps i.on{background:var(--g)}
.runcard{padding:16px 18px;margin-bottom:12px}
.empty{padding:56px;text-align:center;color:var(--ink-3)}
.empty .big-ic{font-size:34px;margin-bottom:10px}
.term-card{padding:20px;text-align:left;position:relative}
.term-card.off{opacity:.55}
.term-ic{width:38px;height:38px;border-radius:10px;background:var(--g-soft);color:var(--g-deep);display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:12px}
.chat{display:flex;height:calc(100vh - 200px);min-height:440px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--sh)}
.chat-list{width:250px;border-right:1px solid var(--border);overflow:auto;background:#fafcfb}
.chat-li{padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.chat-li:hover,.chat-li.on{background:var(--g-softer)}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#f1f5f3;border-bottom-left-radius:4px}
.chat-input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border)}
.pricebar{display:flex;align-items:center;gap:8px}
.pricebar i{height:8px;border-radius:99px;background:var(--g);display:inline-block}
.set-wrap{display:flex;gap:22px;align-items:flex-start}
.set-nav{width:210px;flex:none;position:sticky;top:82px}
.set-nav .nav-i{font-size:13px;padding:7px 11px}
.set-body{flex:1;min-width:0}
.meta{font-size:11.5px;color:var(--ink-3)}
kbd{background:#eef1f0;border-radius:5px;padding:1px 6px;font-size:11px}
</style>
</head>

<div id="app"></div>

<script>
/* ============================================================================
RelianceIQ UI BLUEPRINT v3 — unified session + permissions.
Changes vs v2 (per product decisions):
 • No role picker: everyone logs in → Dashboard. What you see is driven by
   ACCESS TYPE (Org Admin / Sub Admin / Standard / Read-only) + permissions.
 • Full Settings module: Profile, Company Account, Account & Billing, Usage,
   Audit Log, Users, Imports & Exports, Subsidiaries (expanded wizard).
 • System fields everywhere: created by / last modified by / last researched by.
Personas: John (Org Admin) · Mike (Sub Admin) · Amit (Standard) · Leo (Read-only)
          · Neha (Standard, no subsidiary) · Sara (RelianceIQ Ops)
============================================================================ */

/* ---------------- permissions ----------------
   ROLE IS PER-MEMBERSHIP, NOT PER-USER.
   A user can be Sub Admin in one subsidiary and Read-only in another.
   Effective access = org role (if org_admin/riq_ops) else the role on the
   membership row for the ACTIVE subsidiary.                               */
const PERMS = {
  org_admin:["read","part_create","part_edit","part_delete","report_edit","research","user_add","user_edit","user_delete","sub_create","sub_edit","sub_delete","billing"],
  sub_admin:["read","part_create","part_edit","part_delete","report_edit","user_add","user_edit","user_delete","sub_edit"],   // no research (consumes credits), no create/delete sub
  standard:["read","part_create","part_edit","part_delete","report_edit","research"],
  readonly:["read"],
  riq_ops:["read"],
};
function accessOf(u,subId){
  if(!u)return null;
  if(u.orgRole==="org_admin")return "org_admin";
  if(u.orgRole==="riq_ops")return "riq_ops";
  return (u.subRoles||{})[subId]||null;              // null = not a member of that sub
}
function userSubs(u){return u.orgRole==="org_admin"?Object.keys(SUBS):Object.keys(u.subRoles||{});}
function myAccess(){return accessOf(S.user,S.sub);}
function can(p,subId){const a=accessOf(S.user,subId===undefined?S.sub:subId);return !!a&&PERMS[a].includes(p);}
function canSub(p,subId){return can(p,subId);}

/* ---------------- mock data ---------------- */
let COMPANY = { accountName:"AGCO", tz:"America/New_York (ET)", fiscal:"January – December",
  companyName:"AGCO Corporation", domain:"agco.com", address:"4205 River Green Pkwy", city:"Duluth",
  state:"GA", zip:"30096", country:"United States", industry:"Agricultural Machinery" };
const USERS = {

  mike:{ id:"mike", name:"Mike Ross",   email:"mike.ross@agco.com",   orgRole:"member", subRoles:{usa:"sub_admin"}, invite:"Accepted", created:"02 Mar 2026", last:"Today" },
  amit:{ id:"amit", name:"Amit Shah",   email:"amit.shah@agco.com",   orgRole:"member", subRoles:{usa:"standard"}, invite:"Accepted", created:"05 Mar 2026", last:"Today" },
  /* Priya is the multi-role case: Sub Admin in North America, Read-only in Europe */
  priya:{id:"priya",name:"Priya Nair",  email:"priya.nair@agco.com",  orgRole:"member", subRoles:{usa:"sub_admin", eu:"readonly"}, invite:"Accepted", created:"05 Mar 2026", last:"Yesterday" },
  jack:{ id:"jack", name:"Jack Miller", email:"jack.miller@agco.com", orgRole:"member", subRoles:{eu:"sub_admin"}, invite:"Accepted", created:"11 Apr 2026", last:"2d ago" },
  leo:{  id:"leo",  name:"Leo Grant",   email:"leo.grant@agco.com",   orgRole:"member", subRoles:{usa:"readonly"}, invite:"Accepted", created:"20 Jun 2026", last:"3d ago" },
  neha:{ id:"neha", name:"Neha Rao",    email:"neha.rao@agco.com",    orgRole:"member", subRoles:{}, invite:"Accepted", created:"18 Jul 2026", last:"1w ago" },
  kai:{  id:"kai",  name:"Kai Tanaka",  email:"k.tanaka@agco.com",    orgRole:"member", subRoles:{usa:"standard"}, invite:"Invited",  created:"28 Jul 2026", last:"—" },
  sara:{ id:"sara", name:"Sara Kim",    email:"sara@relianceiq.ai",   orgRole:"riq_ops", subRoles:{}, invite:"Accepted", created:"—", last:"—" },
};
const ACCESS_LABEL={org_admin:"Org Admin",sub_admin:"Sub Admin",standard:"Standard User",readonly:"Read-only",riq_ops:"RelianceIQ Ops",member:"Member"};
const PEOPLE = Object.fromEntries(Object.values(USERS).map(u=>[u.id,u.name]));
let SUBS = {
  usa:{ id:"usa", name:"North America Aftermarket", fn:"Parts Research", head:"mike", industry:"Agricultural Machinery",
        city:"Duluth", state:"GA", zip:"30096", continent:"North America", countries:["United States"],
        currency:"USD", tz:"America/New_York (ET)", sharing:true, desc:"US & Canada aftermarket competitive research",
        members:["mike","amit","priya","leo","kai"], created:"Mar 2026" },
  eu:{  id:"eu", name:"Europe Aftermarket", fn:"Parts Research", head:"jack", industry:"Agricultural Machinery",
        city:"Neuhausen", state:"—", zip:"8212", continent:"Europe", countries:["Germany","France","Switzerland"],
        currency:"EUR", tz:"Europe/Berlin (CET)", sharing:true, desc:"DACH + France vendor discovery",
        members:["jack","priya"], created:"Apr 2026" },
};
let LOTS = [
  { id:"L-1041", credits:10000, purchased:"12 Jan 2026", expires:"12 Jul 2027", remaining:6150, invoice:"INV-2026-0112" },
  { id:"L-1057", credits:5000,  purchased:"03 Jun 2026", expires:"03 Dec 2027", remaining:5000, invoice:"INV-2026-0603" },
];

  { t:"Purchase", who:"RelianceIQ", detail:"Lot L-1057 · 5,000 credits", amt:"+5,000", when:"03 Jun 2026" },
  { t:"Allocate", who:"John Carter", detail:"Org → North America Aftermarket", amt:"−600", when:"28 Jun 2026" },
  { t:"Allocate", who:"Mike Ross", detail:"NA purse → Amit Shah", amt:"−150", when:"30 Jun 2026" },
  { t:"Consume", who:"Priya Nair", detail:"Search · 24 parts · RUN-0207", amt:"−24", when:"Yesterday" },
  { t:"Refund",   who:"System", detail:"Zero-result search · PRT-2231 (Priya)", amt:"+1.5", when:"Yesterday" },
];
const CONTINENTS = {
  "North America":["United States","Canada","Mexico"],
  "Europe":["Germany","France","Switzerland","Italy","Spain","Netherlands","Poland","United Kingdom"],
  "Asia":["Japan","India","South Korea","China","Vietnam"],
  "South America":["Brazil","Argentina","Chile"],

/* ---------------- run simulation ---------------- */
function startResearch(){
  if(!can("research")){toast("Your role can't run research — it consumes credits");return;}
  const ids=[...S.selected];const cost=ids.length;
  if(cost>memberBal()){toast("Insufficient credits — ask "+PEOPLE[SUBS[S.sub].head]+" for an allocation");return;}
  BAL.members[S.user.id+":"+S.sub]=(BAL.members[S.user.id+":"+S.sub]||0)-cost;
  const run={id:"RUN-0"+(208+RUNS.length),by:S.user.id,type:"Selected",total:ids.length,done:0,zero:0,failed:0,
             credits:cost,refunded:0,status:"running",when:"Just now",parts:ids,sub:S.sub};
  RUNS.unshift(run);S.selected=new Set();
  ids.forEach(id=>{const pt=PARTS.find(x=>x.id===id);pt.status="queued";pt.progress=0;});
  LEDGER.unshift({t:"Consume",who:S.user.name,detail:`Search · ${ids.length} parts · ${run.id}`,amt:"−"+cost,when:"Just now"});
  toast(`<b>${run.id}</b> started — ${ids.length} parts queued · ${cost} credits deducted`);
  render();tick(run);
}
function tick(run){
  const pending=run.parts.map(id=>PARTS.find(x=>x.id===id)).filter(x=>x.status==="queued"||x.status==="searching");
  if(!pending.length){run.status="completed";
    pushNotif(run.by,"run_done",run.id+" completed",`${run.done-run.zero} with vendors · ${run.zero} zero-result${run.refunded?` · ${run.refunded} credits refunded`:""}`);
    if(run.zero)pushNotif(SUBS[run.sub]?.head||"mike","review_req","New results need review",run.id+" · "+SUBS[run.sub].name);
    render();return;}
  pending.slice(0,3).forEach(pt=>{if(pt.status==="queued")pt.status="searching";
    pt.progress=Math.min(100,pt.progress+18+Math.random()*22);
    if(pt.progress>=100)finishPart(run,pt);});
  render();setTimeout(()=>tick(run),750);
}
function finishPart(run,pt){
  run.done++; pt.resBy=run.by; pt.modBy=run.by;
  if(pt.id==="PRT-1008"){
    pt.status="zero";pt.vendors=0;pt.withPrice=0;pt.last="Just now";
    run.zero++;run.refunded+=0.75;BAL.members[run.by+":"+run.sub]+=0.75;
    LEDGER.unshift({t:"Refund",who:"System",detail:"Zero results · "+pt.mfrNum+" · kept 0.25",amt:"+0.75",when:"Just now"});
    toast(`No vendors for <b>${pt.mfrNum}</b> — 0.75 credits refunded automatically`);
  }else{
    const v=2+Math.floor(Math.random()*6);pt.status="done";pt.vendors=v;pt.withPrice=Math.max(1,v-1);pt.last="Just now";
    if(!VENDORS[pt.id])VENDORS[pt.id]=[
      ven("Motion Industries","$"+(80+Math.random()*400).toFixed(2),0,"5 days","In stock","search",.93,"pending"),
      ven("Aftfasteners","$"+(80+Math.random()*400).toFixed(2),0,"7–10 days","In stock","search",.89,"pending"),
      ven("Accu-components","$"+(80+Math.random()*400).toFixed(2),0,"3 days","Low stock","search",.84,"pending")].slice(0,Math.min(v,3));
  }
}

function autoMap(cols){const m={};const used=new Set();
  cols.forEach(([h])=>{const f=IMPORT_FIELDS.find(f=>!used.has(f.k)&&f.pat.test(h.trim()));
    if(f){m[h]=f.k;used.add(f.k);}else m[h]=null;});

<div style="display:flex;gap:10px;margin:8px 0 4px">
  <label class="card" style="flex:1;padding:12px 14px;cursor:pointer;border-color:${w.dupPolicy==="skip"?"var(--g)":"var(--border)"}">
    <span style="display:flex;gap:8px;align-items:center"><input type="radio" name="dp" ${w.dupPolicy==="skip"?"checked":""} onclick="S.wiz.dupPolicy='skip';render()">
    <b style="font-size:13px">Skip and report</b></span>
    <span class="muted" style="display:block;margin-left:22px">Existing parts are left untouched and listed in the error file</span></label>
  <label class="card" style="flex:1;padding:12px 14px;cursor:pointer;border-color:${w.dupPolicy==="update"?"var(--g)":"var(--border)"}">
    <span style="display:flex;gap:8px;align-items:center"><input type="radio" name="dp" ${w.dupPolicy==="update"?"checked":""} onclick="S.wiz.dupPolicy='update';render()">
    <b style="font-size:13px">Update existing attributes</b></span>
    <span class="muted" style="display:block;margin-left:22px">Overwrites mapped fields; search results and vendors are kept</span></label>
</div>
${r.errors||r.dupes?`<div style="margin-top:14px"><b style="font-size:13.5px">Preview of rows that won't be created</b>
<div class="card" style="margin-top:8px;max-height:180px;overflow:auto"><table class="err-tbl">
<tr><th>Internal SKU</th><th>Description</th><th>MFG</th><th>Part Number</th><th>error</th></tr>
${ERROR_SAMPLE.slice(0,w.dupPolicy==="update"?4:6).filter(e=>w.dupPolicy==="update"?!e[4].startsWith("Duplicate"):true).map(e=>`
<tr>${e.slice(0,4).map(c=>`<td>${esc(c||"—")}</td>`).join("")}<td class="err-cell">${esc(e[4])}</td></tr>`).join("")}
</table></div>
<div class="muted" style="margin-top:6px">The full file keeps your original columns and adds an <b>error</b> column — fix and re-upload just those rows.</div></div>`:""}
<div class="foot"><button class="btn btn-o" onclick="S.wiz.step=2;render()">← Back to mapping</button>
<button class="btn btn-p" onclick="wizSubmit()">Import ${fmt(r.inserted)} parts</button></div>`;
  }

  if(w.step===4&&w.pct<100)return head+`
<div style="text-align:center;padding:20px 0">
  <b>Importing ${f.name}</b>
  <div class="muted" style="margin-top:4px">Staging rows, checking duplicates, writing parts…</div>
  <div class="progress" style="margin:20px 0 8px"><i style="width:${w.pct}%"></i></div>
  <div class="muted mono">${fmt(Math.round(w.pct/100*(w.dupPolicy==="update"?f.result.inserted+f.result.dupes:f.result.inserted)))} / ${fmt(w.dupPolicy==="update"?f.result.inserted+f.result.dupes:f.result.inserted)} parts written</div>
  <div class="muted" style="margin-top:10px">Fast — the file was already parsed and checked during review; this is the database write.</div>
  <div class="muted" style="margin-top:8px">You can close this — the import continues and you'll be notified.</div>
</div>
<div class="foot"><button class="btn btn-o" onclick="closeModal()">Close, notify me</button></div>`;

  const r=f.result;const created=w.dupPolicy==="update"?r.inserted+r.dupes:r.inserted;
  return head+`
<div class="card" style="padding:14px 16px;background:var(--g-softer);margin-bottom:14px">
  <b>Import complete — ${f.name}</b><div class="muted">${fmt(f.rows)} rows processed · created by ${S.user.name}</div></div>
<div class="kpis">
  <div class="card kpi"><div class="l">PARTS ${w.dupPolicy==="update"?"CREATED / UPDATED":"CREATED"}</div><div class="v" style="color:var(--g-dark)">${fmt(created)}</div></div>
  <div class="card kpi"><div class="l">DUPLICATES</div><div class="v" style="color:${r.dupes?"var(--amber)":"var(--ink-3)"}">${fmt(w.dupPolicy==="update"?0:r.dupes)}</div><div class="d">${w.dupPolicy==="update"?"updated instead":"skipped"}</div></div>
  <div class="card kpi"><div class="l">NOT CREATED</div><div class="v" style="color:${r.errors?"var(--red)":"var(--ink-3)"}">${fmt(r.errors)}</div><div class="d">in the error file</div></div>
  <div class="card kpi"><div class="l">READY TO RESEARCH</div><div class="v mono">${fmt(created)}</div></div>
</div>
<div class="foot">${r.errors||(r.dupes&&w.dupPolicy==="skip")?`<button class="btn btn-o" onclick="S.modal={t:'errfile'};render()">↧ Download error file (${fmt(r.errors+(w.dupPolicy==="skip"?r.dupes:0))} rows)</button>`:""}
<button class="btn btn-p" onclick="wizDone()">Done</button></div>`;
}
/* ---- error file preview: what the downloaded CSV looks like when opened ---- */
function mErrFile(){
  const f=IMPORT_FILES[S.wiz?.scn||"mixed"];
  const headers=f.cols.map(c=>c[0]);
  const total=f.result.errors+(S.wiz?.dupPolicy==="update"?0:f.result.dupes);
  const rows=ERROR_FILE_ROWS.filter(x=>S.wiz?.dupPolicy==="update"?!x.e.startsWith("Duplicate — part already"):true);
  const fname=f.name.replace(/\.(csv|xlsx)$/,"")+"_errors.csv";
  return `
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
  <div><h3>${fname}</h3>
  <div class="muted">${fmt(total)} rows that were not imported · your original columns, unchanged, with an <b>error</b> column appended</div></div>
  <button class="btn-ghost" onclick="S.modal={t:'upload'};render()">✕</button>
</div>
<div style="margin-top:16px"><span class="sheet-tab">▦ ${fname}</span></div>
<div class="sheet">
  <table>
    <tr class="colhdr"><th class="rn"></th>${headers.map((_,i)=>`<th>${COL_LETTERS[i]}</th>`).join("")}<th style="background:#f6dedb;color:var(--red)">${COL_LETTERS[headers.length]}</th></tr>
    <thead><tr><th class="rn">1</th>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}<th style="background:#fbeceb;color:var(--red)">error</th></tr></thead>
    <tbody>
    ${rows.map((x,i)=>`<tr>
      <td class="rn">${i+2}</td>
      ${x.r.map((c,ci)=>`<td contenteditable class="${ci===x.bad?"cell-bad":""}" title="${ci===x.bad?"This is the value to fix":"Click to edit"}">${esc(c)}</td>`).join("")}
      <td class="cell-err">${esc(x.e)}</td>
    </tr>`).join("")}
    ${total>rows.length?`<tr><td class="rn">…</td><td colspan="${headers.length+1}" class="muted" style="text-align:center">… ${fmt(total-rows.length)} more rows</td></tr>`:""}
    </tbody>
  </table>
</div>
<div class="card" style="padding:13px 16px;margin-top:14px;background:var(--g-softer)">
  <b style="font-size:13px">How your team fixes this</b>
  <div class="muted" style="margin-top:6px;line-height:1.65">
    1. Open the file — every original column is preserved, so it looks exactly like what you uploaded.<br>
    2. Fix the highlighted cells (try editing one above). For duplicates, either delete the row or re-import with <b>Update existing attributes</b>.<br>
    3. Upload this same file again — no need to delete the <b>error</b> column, the wizard maps it to <i>Do not import</i> automatically.<br>
    4. Only these rows are processed, so nothing is created twice.
  </div>
</div>
<div class="foot">
  <button class="btn btn-o" onclick="toast('${fname} saved to your downloads')">↧ Save file</button>
  <button class="btn btn-p" onclick="reuploadFixed()">↥ Re-upload this fixed file</button>
</div>`;}
function reuploadFixed(){
  const scn=S.wiz?.scn||"mixed";
  const f=IMPORT_FILES[scn];
  /* simulate the corrected file coming back: original columns + the error column */
  IMPORT_FILES.fixed={name:f.name.replace(/\.(csv|xlsx)$/,"")+"_errors_fixed.csv",
    rows:f.result.errors+f.result.dupes,
    cols:[...f.cols,["error",["Duplicate — part already exists…","Missing mandatory field: Manufacturer","Invalid number in List Price USD"]]],
    result:{inserted:f.result.errors,dupes:f.result.dupes,errors:0}};
  S.modal={t:"upload"};wizOpen("fixed");
  toast("Corrected file loaded — note the <b>error</b> column auto-maps to “Do not import”");}

function wizMap(h,v){S.wiz.map[h]=v||null;render();}
function wizValidate(){
  const f=IMPORT_FILES[S.wiz.scn];S.wiz.step=3;
  if(f.rows<=SYNC_ROW_LIMIT){S.wiz.vpct=null;toast("Dry run — file staged and checked, nothing written yet");render();return;}
  /* big file: background validation with progress (demo speed is compressed) */
  S.wiz.vpct=0;render();
  const iv=setInterval(()=>{ if(!S.wiz||S.wiz.step!==3){clearInterval(iv);return;}
    S.wiz.vpct+=7+Math.random()*10;
    if(S.wiz.vpct>=100){S.wiz.vpct=100;clearInterval(iv);
      pushNotif(S.user.id,"upload_done","Import ready for review",`${f.name} · ${fmt(f.result.inserted)} new · ${fmt(f.result.dupes)} duplicates · ${fmt(f.result.errors)} invalid`);
      if(S.modal?.t!=="upload")toast("✓ <b>Validation complete</b> — open the import to review");}
    if(S.modal?.t==="upload")render();else renderBell();},300);}
function wizSubmit(){S.wiz.step=4;S.wiz.pct=0;render();
  const f=IMPORT_FILES[S.wiz.scn];
  const iv=setInterval(()=>{ if(!S.wiz){clearInterval(iv);return;}
    S.wiz.pct+=9+Math.random()*14;
    if(S.wiz.pct>=100){S.wiz.pct=100;clearInterval(iv);
      const r=f.result,created=S.wiz.dupPolicy==="update"?r.inserted+r.dupes:r.inserted;
      UPLOADS.unshift({id:"UP-00"+(33+UPLOADS.length),file:f.name,by:S.user.id,sub:S.sub,rows:f.rows,
        added:created,dupes:S.wiz.dupPolicy==="update"?0:r.dupes,errors:r.errors,status:"completed",when:"Just now"});
      pushNotif(S.user.id,"upload_done","Import processed",`${f.name} · ${fmt(created)} created · ${fmt(r.dupes)} duplicates · ${fmt(r.errors)} errors`);
      if(S.modal?.t!=="upload")toast("↥ <b>Import complete</b> — see notifications");}
    if(S.modal?.t==="upload")render();else renderBell();},360);}
function wizDone(){const f=IMPORT_FILES[S.wiz.scn],r=f.result;
  const created=S.wiz.dupPolicy==="update"?r.inserted+r.dupes:r.inserted;
  S.wiz=null;closeModal();
  toast(`<b>${fmt(created)} parts</b> added to ${SUBS[S.sub].name}${AUTOSEARCH.onUpload?" · Auto Search queued them for research":""}`);}

/* ---------------- drawers ---------------- */
function renderDrawer(){
  if(S.drawer.t==="subdetail")return subDetailDrawer(S.drawer.sub);
  const pt=PARTS.find(x=>x.id===S.drawer.part)||{id:S.drawer.part,name:S.drawer.part,mfr:"—",mfrNum:"—",createdBy:null,modBy:null,resBy:null};
  const vs=VENDORS[pt.id]||[]; const ce=can("part_edit");
  return `
<div class="overlay" style="justify-content:flex-end;background:rgba(20,35,30,.3)" onclick="if(event.target===this){S.drawer=null;render()}"></div>
<div class="drawer">
  <div class="d-head">
    <div><b style="font-size:16px">${pt.name}</b>
      <div class="muted" style="margin-top:3px">${pt.mfr} · <span class="mono">${pt.mfrNum}</span>${S.sub?" · "+SUBS[S.sub].continent:""}</div>
      <div style="margin-top:5px">${metaLine(pt)}</div></div>
    <button class="btn-ghost" onclick="S.drawer=null;render()">✕</button>
  </div>
  <div class="d-body">
    <div style="display:flex;gap:9px;margin-bottom:16px">
      ${ce?`<button class="btn btn-o btn-sm" onclick="stub('Add vendor — manual form: name, URL, price, lead time')">+ Add vendor</button>`:""}
      ${can("research")?`<button class="btn btn-o btn-sm" onclick="toast('Re-run · 0.25 credits per vendor')">↻ Re-run all</button>`:""}
      <div style="flex:1"></div><span class="muted" style="align-self:center">${vs.length} vendors</span>
    </div>
    ${vs.length?vs.map((v,i)=>`
    <div class="vendor-row">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><b>${v.name}</b>
          ${v.conf<0.7?'<span class="chip chip-warn" title="AI part-match confidence low">AI ⚠ '+Math.round(v.conf*100)+'%</span>':'<span class="chip chip-mut">AI '+Math.round(v.conf*100)+'%</span>'}
          ${v.status==="accepted"?'<span class="chip chip-ok">Accepted</span>':v.status==="rejected"?'<span class="chip chip-bad">Rejected</span>':'<span class="chip chip-info">Pending review</span>'}
        </div>
        <a class="muted" href="#" onclick="event.preventDefault();toast('Opens vendor product page')">visit ↗</a>
      </div>
      <div style="display:flex;gap:22px;margin-top:9px;font-size:13px">
        <span><span class="muted">Price</span><br><b class="mono">${v.price}</b></span>
        <span><span class="muted">Lead time</span><br><b>${v.lead}</b></span>
        <span><span class="muted">Availability</span><br><b>${v.stock}</b></span>
        <span><span class="muted">Source</span><br><b>${v.source}</b></span>
        <span style="flex:1"></span>
        ${ce?(v.status==="pending"?`
        <span style="display:flex;gap:7px;align-self:center">
          <button class="btn btn-p btn-sm" onclick="setVendor('${pt.id}',${i},'accepted')">Accept</button>
          <button class="btn btn-o btn-sm btn-danger" onclick="setVendor('${pt.id}',${i},'rejected')">Reject</button>
        </span>`:`<button class="btn-ghost btn-sm" style="align-self:center" onclick="setVendor('${pt.id}',${i},'pending')">Undo</button>`)
        :'<span class="chip chip-mut" style="align-self:center">Read-only</span>'}
      </div>
    </div>`).join(""):`<div class="empty">No vendors yet — run a search for this part.</div>`}
  </div>
</div>`;}
function setVendor(pid,i,st){VENDORS[pid][i].status=st;
  const pt=PARTS.find(x=>x.id===pid);
  if(pt){pt.modBy=S.user.id;pt.accepted=(VENDORS[pid].filter(v=>v.status==="accepted")).length;}
  if(st==="accepted")toast(`<b>${VENDORS[pid][i].name}</b> accepted · last modified by ${S.user.name}`);
  render();}
function subDetailDrawer(id){const s=SUBS[id];const u=USAGE[id]||{alloc:0,used:0};const admin=canSub("sub_edit",id);return `
<div class="overlay" style="justify-content:flex-end;background:rgba(20,35,30,.3)" onclick="if(event.target===this){S.drawer=null;render()}"></div>
<div class="drawer">
  <div class="d-head">
    <div><b style="font-size:16px">${s.name}</b><div class="muted" style="margin-top:3px">${s.fn} · created ${s.created}</div></div>
    <button class="btn-ghost" onclick="S.drawer=null;render()">✕</button>
  </div>
  <div class="d-body">
    <div class="rowline"><span class="muted">Subsidiary admin / owner</span><b>${PEOPLE[s.head]}</b></div>
    <div class="rowline"><span class="muted">Industry</span><b>${esc(s.industry||"—")}</b></div>
    <div class="rowline"><span class="muted">Address</span><b>${esc([s.city,s.state,s.zip].filter(x=>x&&x!=="—").join(", ")||"—")}</b></div>
    <div class="rowline"><span class="muted">Region</span><b>${s.continent}${s.countries.length?" · "+s.countries.join(", "):" (whole continent)"}</b></div>
    <div class="rowline"><span class="muted">Default currency / time zone</span><b>${s.currency} · ${s.tz}</b></div>
    <div class="rowline"><span class="muted">Work sharing</span><b>${s.sharing?"On":"Off"}</b></div>
    <div class="rowline"><span class="muted">Description</span><b style="text-align:right;max-width:280px">${esc(s.desc||"—")}</b></div>
    <div class="rowline"><span class="muted">Credits — allocated / spent / purse</span><b class="mono">${fmt(u.alloc)} / ${fmt(u.used)} / ${fmt(BAL.subs[id]||0)}</b></div>
    <div style="display:flex;gap:8px;margin:14px 0 18px">
      ${admin?`<button class="btn btn-o btn-sm" onclick="stub('Edit subsidiary — same wizard, prefilled; changes audit-logged')">Edit</button>`:""}
      ${S.user.orgRole==="org_admin"?`<button class="btn btn-o btn-sm" onclick="S.drawer=null;openModal('allocSub','${id}')">Allocate credits</button>`:""}
      ${admin&&can("user_add")?`<button class="btn btn-o btn-sm" onclick="S.drawer=null;openModal('invite')">+ Add user</button>`:""}
    </div>
    <h3 style="font-size:14px;margin-bottom:8px">Members (${s.members.length})</h3>
    ${s.members.map(m=>{const bal=BAL.members[m+":"+id]??0;return `
    <div class="vendor-row" style="display:flex;align-items:center;gap:10px">
      <span class="avatar">${av(PEOPLE[m]||m)}</span>
      <span style="flex:1"><b>${PEOPLE[m]||m}</b>${m===s.head?' <span class="chip chip-info">Admin</span>':""}${USERS[m]?.invite==="Invited"?' <span class="chip chip-warn">Invited</span>':""}<br>
      <span class="muted">${ACCESS_LABEL[(USERS[m]?.subRoles||{})[id]]||"Standard User"} · ${fmt(bal)} credits available</span></span>
      ${admin?`<button class="btn btn-o btn-sm" onclick="openModal('allocMember','${m}')">Allocate</button>
      <button class="btn-ghost btn-sm btn-danger" onclick="recallIn('${m}','${id}')">Recall</button>`:""}
    </div>`;}).join("")}
  </div>
</div>`;}
function recallIn(m,sid){const k=m+":"+sid;const b=BAL.members[k]||0;
  if(!b){toast("Nothing to recall — "+PEOPLE[m]+" has 0 available credits");return;}
  BAL.members[k]=0;BAL.subs[sid]+=b;
  LEDGER.unshift({t:"Recall",who:S.user.name,detail:PEOPLE[m]+" → "+SUBS[sid].name+" purse",amt:"+"+fmt(b),when:"Just now"});
  toast(`Recalled <b>${fmt(b)}</b> credits from ${PEOPLE[m]}`);render();}

/* ---------------- boot ---------------- */
render();
</script>
</body>
</html>
